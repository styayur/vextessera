name: GLib source backport

on:
  pull_request:
  push:
    branches: [main, 'fix/glib-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimized-regression:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - name: Verify source, application patch and license inventory
        run: python3 security/verify_glib_backport.py
      - name: Optimized pointer and iterator regression
        run: cargo run --release --locked --manifest-path security/glib-regression/Cargo.toml
      - name: Record target-specific application dependency reachability
        run: |
          cargo tree --locked --all-features --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu -i glib > security/glib-linux-tree.txt
          cargo tree --locked --all-features --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc -i glib > security/glib-windows-tree.txt
          grep -F 'vendor/glib' security/glib-linux-tree.txt
          test ! -s security/glib-windows-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glib-target-reachability
          path: security/glib-*-tree.txt
          if-no-files-found: error

  full-rust-analysis:
    name: Full Rust CodeQL
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Initialize full repository Rust analysis on push
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          db-location: ${{ runner.temp }}/codeql-glib-full-db
      - name: Analyze without publishing a competing default configuration
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-glib-full
          upload: never
          upload-database: false
          category: /language:rust/glib-full
      - name: Verify source coverage includes the string bridge and all affected fields
        env:
          GLIB_CODEQL_DATABASE: ${{ runner.temp }}/codeql-glib-full-db
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          archives = list(pathlib.Path(os.environ['GLIB_CODEQL_DATABASE']).rglob('src.zip'))
          assert len(archives) == 1, 'Expected one Rust source archive'
          required = ['vendor/glib/src/gstring.rs', 'vendor/glib/src/object.rs',
                      'vendor/glib/src/value.rs', 'vendor/glib/src/subclass/boxed.rs']
          coverage = []
          with zipfile.ZipFile(archives[0]) as archive:
              for path in required:
                  entries = [name for name in archive.namelist() if name.endswith(path)]
                  assert len(entries) == 1, path
                  source = pathlib.Path(path).read_bytes()
                  assert archive.getinfo(entries[0]).file_size == len(source), path
                  assert archive.read(entries[0]) == source, path
                  coverage.append({'path': path, 'sha256': hashlib.sha256(source).hexdigest()})
          pathlib.Path('codeql-glib-full/source-coverage.json').write_text(json.dumps(coverage, indent=2))
          print('Full Rust source archive matches the bridge and all affected field source bytes')
          PY
      - name: Require zero findings in the full SARIF
        run: node scripts/codeql_results_gate.mjs codeql-glib-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glib-full-rust-codeql
          path: |
            codeql-glib-full/*.sarif
            codeql-glib-full/source-coverage.json
          if-no-files-found: error
